<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上圖片拼貼工具 Photo Collage Maker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f6ff',
              100: '#e0edff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.8);
    }
    /* Grid background for canvas area */
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(100, 116, 139, 0.2) 1px, transparent 0);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans flex flex-col antialiased selection:bg-brand-500 selection:text-white overflow-hidden">

  <!-- Header -->
  <header class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-table-cells-large text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">CollageCraft Pro</h1>
        <p class="text-xs text-slate-400">極簡現代圖片拼貼工具</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button id="btnClearAll" class="px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        <i class="fa-solid fa-trash-can"></i>
        <span>清空圖片</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- Sidebar / Control Panel -->
    <aside class="w-full md:w-80 lg:w-96 border-r border-slate-800 bg-slate-900/90 flex flex-col z-10 shrink-0 h-[40vh] md:h-auto overflow-y-auto">
      
      <!-- Tabs Navigation -->
      <div class="flex border-b border-slate-800 sticky top-0 bg-slate-900 z-10">
        <button class="tab-btn active flex-1 py-3 text-xs font-semibold text-brand-500 border-b-2 border-brand-500 flex flex-col items-center gap-1 transition" data-tab="layout">
          <i class="fa-solid fa-border-all text-base"></i>
          <span>版型配置</span>
        </button>
        <button class="tab-btn flex-1 py-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 flex flex-col items-center gap-1 transition" data-tab="style">
          <i class="fa-solid fa-sliders text-base"></i>
          <span>間距與微調</span>
        </button>
        <button class="tab-btn flex-1 py-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 flex flex-col items-center gap-1 transition" data-tab="background">
          <i class="fa-solid fa-palette text-base"></i>
          <span>色彩背景</span>
        </button>
      </div>

      <!-- Tab Content Area -->
      <div class="p-5 flex-1 space-y-6">

        <!-- TAB 1: Layout Selection -->
        <div id="tab-layout" class="tab-content space-y-5">
          <div>
            <label class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-2 block">畫布長寬比例 (Aspect Ratio)</label>
            <div class="grid grid-cols-4 gap-2">
              <button class="ratio-btn active p-2.5 rounded-lg border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-xs text-center flex flex-col items-center gap-1" data-ratio="1:1">
                <span class="w-4 h-4 border border-current rounded-sm"></span>
                <span>1:1</span>
              </button>
              <button class="ratio-btn p-2.5 rounded-lg border border-slate-800 hover:bg-slate-800 text-xs text-center flex flex-col items-center gap-1 text-slate-400" data-ratio="4:3">
                <span class="w-5 h-3.5 border border-current rounded-sm"></span>
                <span>4:3</span>
              </button>
              <button class="ratio-btn p-2.5 rounded-lg border border-slate-800 hover:bg-slate-800 text-xs text-center flex flex-col items-center gap-1 text-slate-400" data-ratio="16:9">
                <span class="w-5 h-3 border border-current rounded-sm"></span>
                <span>16:9</span>
              </button>
              <button class="ratio-btn p-2.5 rounded-lg border border-slate-800 hover:bg-slate-800 text-xs text-center flex flex-col items-center gap-1 text-slate-400" data-ratio="9:16">
                <span class="w-3 h-5 border border-current rounded-sm"></span>
                <span>9:16</span>
              </button>
            </div>
          </div>

          <div>
            <label class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-2 block">選擇拼貼版型 (Layout Template)</label>
            <div id="layoutGrid" class="grid grid-cols-3 gap-3">
              <!-- JS Dynamic Grid Layouts inserted here -->
            </div>
          </div>
        </div>

        <!-- TAB 2: Style Settings -->
        <div id="tab-style" class="tab-content hidden space-y-5">
          <!-- Gap / Spacing -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-medium text-slate-300">圖片間距 (Gap)</label>
              <span id="valGap" class="text-xs text-slate-400 font-mono">10px</span>
            </div>
            <input type="range" id="inputGap" min="0" max="40" value="10" class="w-full accent-brand-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
          </div>

          <!-- Border Radius -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-medium text-slate-300">區塊圓角 (Radius)</label>
              <span id="valRadius" class="text-xs text-slate-400 font-mono">8px</span>
            </div>
            <input type="range" id="inputRadius" min="0" max="50" value="8" class="w-full accent-brand-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
          </div>

          <!-- Outer Margin / Frame Padding -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-medium text-slate-300">畫布內邊距 (Padding)</label>
              <span id="valPadding" class="text-xs text-slate-400 font-mono">10px</span>
            </div>
            <input type="range" id="inputPadding" min="0" max="50" value="10" class="w-full accent-brand-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
          </div>

          <hr class="border-slate-800 my-4">

          <!-- Selected Block Custom Edit -->
          <div id="activeBlockControls" class="p-4 rounded-xl border border-slate-800 bg-slate-800/30 space-y-3">
            <h4 class="text-xs font-semibold text-slate-300 flex items-center justify-between">
              <span class="flex items-center gap-2">
                <i class="fa-solid fa-sliders text-brand-500"></i>
                <span>選取區塊微調 (Selected Slot)</span>
              </span>
              <button id="btnResetImg" class="text-[11px] text-slate-400 hover:text-brand-400 transition hidden" title="重設圖片變形">
                <i class="fa-solid fa-rotate-left"></i> 重設
              </button>
            </h4>
            <p id="noBlockSelectedHint" class="text-xs text-slate-500 italic">點擊畫布上的特定圖片進行旋轉與縮放</p>
            
            <div id="blockControls" class="space-y-3 hidden">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <label class="text-xs text-slate-400">縮放比例 (Zoom) <span class="text-[10px] text-slate-500">(可滾輪縮放)</span></label>
                  <span id="valZoom" class="text-xs text-slate-400 font-mono">100%</span>
                </div>
                <input type="range" id="inputZoom" min="0.5" max="3" step="0.05" value="1" class="w-full accent-brand-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
              </div>

              <div>
                <div class="flex justify-between items-center mb-1">
                  <label class="text-xs text-slate-400">旋轉角度 (Rotate)</label>
                  <span id="valRotate" class="text-xs text-slate-400 font-mono">0°</span>
                </div>
                <div class="flex items-center gap-2">
                  <input type="range" id="inputRotate" min="-180" max="180" value="0" class="flex-1 accent-brand-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                  <button id="btnRotate90" class="p-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 shrink-0" title="順時針旋轉 90°">
                    <i class="fa-solid fa-rotate-right"></i> +90°
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2 pt-1">
                <button id="btnFlipH" class="py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 transition">
                  <i class="fa-solid fa-arrows-left-right mr-1"></i> 水平翻轉
                </button>
                <button id="btnFlipV" class="py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 transition">
                  <i class="fa-solid fa-arrows-up-down mr-1"></i> 垂直翻轉
                </button>
              </div>

              <div class="flex gap-2 pt-1">
                <label for="replaceImgInput" class="flex-1 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 transition text-center cursor-pointer">
                  <i class="fa-solid fa-arrows-rotate mr-1"></i> 替換圖片
                </label>
                <input type="file" id="replaceImgInput" accept="image/*" class="hidden">
                <button id="btnRemoveImg" class="py-1.5 px-3 rounded bg-red-500/10 hover:bg-red-500/20 text-xs text-red-400 transition">
                  <i class="fa-solid fa-trash mr-1"></i> 刪除
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB 3: Background Settings -->
        <div id="tab-background" class="tab-content hidden space-y-5">
          <!-- Background Type -->
          <div>
            <label class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-2 block">背景類型</label>
            <div class="grid grid-cols-2 gap-2 mb-4">
              <button id="bgTypeSolid" class="p-2 rounded-lg border border-brand-500 bg-brand-500/10 text-xs font-medium text-brand-400">純色背景</button>
              <button id="bgTypeGradient" class="p-2 rounded-lg border border-slate-800 bg-slate-800/50 text-xs font-medium text-slate-400 hover:text-slate-200">漸層背景</button>
            </div>

            <!-- Solid Colors Preset -->
            <div id="solidColorPanel" class="space-y-3">
              <label class="text-xs text-slate-400 block">快捷配色</label>
              <div class="flex flex-wrap gap-2.5">
                <button class="color-picker-preset w-8 h-8 rounded-full border-2 border-white/20 bg-white shadow-sm transition hover:scale-110" data-color="#ffffff"></button>
                <button class="color-picker-preset w-8 h-8 rounded-full border-2 border-white/20 bg-slate-900 shadow-sm transition hover:scale-110" data-color="#0f172a"></button>
                <button class="color-picker-preset w-8 h-8 rounded-full border-2 border-white/20 bg-amber-100 shadow-sm transition hover:scale-110" data-color="#fef3c7"></button>
                <button class="color-picker-preset w-8 h-8 rounded-full border-2 border-white/20 bg-rose-200 shadow-sm transition hover:scale-110" data-color="#fecdd3"></button>
                <button class="color-picker-preset w-8 h-8 rounded-full border-2 border-white/20 bg-sky-200 shadow-sm transition hover:scale-110" data-color="#bae6fd"></button>
                <button class="color-picker-preset w-8 h-8 rounded-full border-2 border-white/20 bg-emerald-200 shadow-sm transition hover:scale-110" data-color="#a7f3d0"></button>
                <button class="color-picker-preset w-8 h-8 rounded-full border-2 border-white/20 bg-purple-200 shadow-sm transition hover:scale-110" data-color="#e9d5ff"></button>
              </div>
              <div class="flex items-center gap-3 pt-2">
                <span class="text-xs text-slate-400">自訂顏色:</span>
                <input type="color" id="inputCustomBgColor" value="#ffffff" class="w-8 h-8 rounded border-0 cursor-pointer bg-transparent">
              </div>
            </div>

            <!-- Gradient Presets -->
            <div id="gradientColorPanel" class="space-y-3 hidden">
              <label class="text-xs text-slate-400 block">漸層風格</label>
              <div class="grid grid-cols-2 gap-2">
                <button class="gradient-preset h-12 rounded-lg border border-white/10 bg-gradient-to-r from-pink-500 to-rose-500" data-gradient="linear-gradient(135deg, #ec4899, #f43f5e)"></button>
                <button class="gradient-preset h-12 rounded-lg border border-white/10 bg-gradient-to-r from-blue-500 to-teal-400" data-gradient="linear-gradient(135deg, #3b82f6, #2dd4bf)"></button>
                <button class="gradient-preset h-12 rounded-lg border border-white/10 bg-gradient-to-r from-violet-600 to-indigo-600" data-gradient="linear-gradient(135deg, #7c3aed, #4f46e5)"></button>
                <button class="gradient-preset h-12 rounded-lg border border-white/10 bg-gradient-to-r from-amber-400 to-orange-500" data-gradient="linear-gradient(135deg, #fbbf24, #f97316)"></button>
                <button class="gradient-preset h-12 rounded-lg border border-white/10 bg-gradient-to-r from-slate-900 to-slate-700" data-gradient="linear-gradient(135deg, #0f172a, #334155)"></button>
                <button class="gradient-preset h-12 rounded-lg border border-white/10 bg-gradient-to-r from-fuchsia-500 to-cyan-500" data-gradient="linear-gradient(135deg, #d946ef, #06b6d4)"></button>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Quick Upload & Download Section in Sidebar Foot -->
      <div class="p-4 border-t border-slate-800 bg-slate-950/50 space-y-3">
        <!-- 批量上傳圖片 -->
        <label for="globalImageUpload" class="w-full py-2.5 px-4 rounded-xl border border-dashed border-slate-700 hover:border-brand-500 bg-slate-800/40 hover:bg-slate-800 text-xs font-medium text-slate-300 hover:text-white flex items-center justify-center gap-2 cursor-pointer transition">
          <i class="fa-solid fa-cloud-arrow-up text-brand-500 text-base"></i>
          <span>批量上傳圖片 (可多選)</span>
        </label>
        <input type="file" id="globalImageUpload" multiple accept="image/*" class="hidden">

        <!-- 下載圖片控制區 (新增於上傳圖片下方) -->
        <div class="pt-2 border-t border-slate-800/60 space-y-2">
          <div class="flex items-center gap-2">
            <select id="exportFormat" class="flex-1 bg-slate-900 text-xs font-semibold text-slate-200 px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-brand-500 cursor-pointer">
              <option value="png">PNG (無損)</option>
              <option value="jpeg" selected>JPG (高畫質)</option>
            </select>

            <select id="exportQuality" class="flex-1 bg-slate-900 text-xs font-semibold text-slate-200 px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-brand-500 cursor-pointer">
              <option value="1.0">100% 品質</option>
              <option value="0.9" selected>90% 品質</option>
              <option value="0.8">80% 品質</option>
            </select>
          </div>

          <button id="btnExport" class="w-full py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white shadow-md shadow-brand-600/20 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i>
            <span>下載拼貼圖片</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Canvas Preview Area -->
    <main class="flex-1 bg-slate-950 bg-grid-pattern relative flex flex-col items-center justify-center p-4 sm:p-8 overflow-auto">
      
      <!-- Canvas Wrapper Frame -->
      <div id="canvasContainer" class="relative max-w-full max-h-full flex items-center justify-center transition-all duration-300 shadow-2xl rounded-2xl overflow-hidden group">
        <!-- Collage Canvas Mount -->
        <div id="collageCanvas" class="relative transition-all duration-200 overflow-hidden" style="width: 500px; height: 500px; background-color: #ffffff;">
          <!-- Blocks generated dynamically via JS -->
        </div>
      </div>

      <!-- Instruction / Tip Toast -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 pointer-events-none bg-slate-900/90 border border-slate-800 backdrop-blur px-4 py-2 rounded-full text-xs text-slate-400 flex items-center gap-2 shadow-xl">
        <i class="fa-solid fa-circle-info text-brand-500"></i>
        <span>提示：點擊圖片可對其單獨調整，使用滾輪或雙指可縮放照片</span>
      </div>
    </main>

  </div>

  <!-- Hidden HTML Canvas for Export Rendering -->
  <canvas id="exportCanvas" class="hidden"></canvas>

  <!-- JavaScript Logic -->
  <script>
    // --- Layout Definitions ---
    const LAYOUT_TEMPLATES = [
      {
        id: '1-full',
        name: '單圖填滿',
        count: 1,
        rects: [{ top: 0, left: 0, width: 100, height: 100 }]
      },
      {
        id: '2-v',
        name: '左右 2 分格',
        count: 2,
        rects: [
          { top: 0, left: 0, width: 50, height: 100 },
          { top: 0, left: 50, width: 50, height: 100 }
        ]
      },
      {
        id: '2-h',
        name: '上下 2 分格',
        count: 2,
        rects: [
          { top: 0, left: 0, width: 100, height: 50 },
          { top: 50, left: 0, width: 100, height: 50 }
        ]
      },
      {
        id: '3-left-main',
        name: '左大右雙',
        count: 3,
        rects: [
          { top: 0, left: 0, width: 50, height: 100 },
          { top: 0, left: 50, width: 50, height: 50 },
          { top: 50, left: 50, width: 50, height: 50 }
        ]
      },
      {
        id: '3-v',
        name: '直式 3 分格',
        count: 3,
        rects: [
          { top: 0, left: 0, width: 33.333, height: 100 },
          { top: 0, left: 33.333, width: 33.333, height: 100 },
          { top: 0, left: 66.666, width: 33.334, height: 100 }
        ]
      },
      {
        id: '4-grid',
        name: '經典 2x2',
        count: 4,
        rects: [
          { top: 0, left: 0, width: 50, height: 50 },
          { top: 0, left: 50, width: 50, height: 50 },
          { top: 50, left: 0, width: 50, height: 50 },
          { top: 50, left: 50, width: 50, height: 50 }
        ]
      },
      {
        id: '4-header',
        name: '一長三方',
        count: 4,
        rects: [
          { top: 0, left: 0, width: 100, height: 50 },
          { top: 50, left: 0, width: 33.333, height: 50 },
          { top: 50, left: 33.333, width: 33.333, height: 50 },
          { top: 50, left: 66.666, width: 33.334, height: 50 }
        ]
      },
      {
        id: '5-mix',
        name: '五圖組合',
        count: 5,
        rects: [
          { top: 0, left: 0, width: 50, height: 50 },
          { top: 0, left: 50, width: 50, height: 50 },
          { top: 50, left: 0, width: 33.333, height: 50 },
          { top: 50, left: 33.333, width: 33.333, height: 50 },
          { top: 50, left: 66.666, width: 33.334, height: 50 }
        ]
      },
      {
        id: '6-grid',
        name: '六格 2x3',
        count: 6,
        rects: [
          { top: 0, left: 0, width: 33.333, height: 50 },
          { top: 0, left: 33.333, width: 33.333, height: 50 },
          { top: 0, left: 66.666, width: 33.334, height: 50 },
          { top: 50, left: 0, width: 33.333, height: 50 },
          { top: 50, left: 33.333, width: 33.333, height: 50 },
          { top: 50, left: 66.666, width: 33.334, height: 50 }
        ]
      },
      {
        id: '9-grid',
        name: '九宮格 3x3',
        count: 9,
        rects: Array.from({ length: 9 }, (_, i) => ({
          top: Math.floor(i / 3) * 33.333,
          left: (i % 3) * 33.333,
          width: 33.333,
          height: 33.333
        }))
      }
    ];

    // --- State Management ---
    const state = {
      currentLayout: LAYOUT_TEMPLATES[5], // Default 2x2
      aspectRatio: '1:1',
      gap: 10,
      radius: 8,
      padding: 10,
      background: {
        type: 'solid',
        color: '#ffffff',
        gradient: 'linear-gradient(135deg, #ec4899, #f43f5e)'
      },
      blocksData: [],
      activeBlockIndex: null
    };

    // --- DOM Elements ---
    const collageCanvas = document.getElementById('collageCanvas');
    const layoutGrid = document.getElementById('layoutGrid');
    const activeBlockControls = document.getElementById('activeBlockControls');
    const blockControls = document.getElementById('blockControls');
    const noBlockSelectedHint = document.getElementById('noBlockSelectedHint');
    const btnResetImg = document.getElementById('btnResetImg');

    const inputGap = document.getElementById('inputGap');
    const inputRadius = document.getElementById('inputRadius');
    const inputPadding = document.getElementById('inputPadding');
    const valGap = document.getElementById('valGap');
    const valRadius = document.getElementById('valRadius');
    const valPadding = document.getElementById('valPadding');

    const inputZoom = document.getElementById('inputZoom');
    const inputRotate = document.getElementById('inputRotate');
    const valZoom = document.getElementById('valZoom');
    const valRotate = document.getElementById('valRotate');
    const btnRotate90 = document.getElementById('btnRotate90');
    const btnFlipH = document.getElementById('btnFlipH');
    const btnFlipV = document.getElementById('btnFlipV');
    const btnRemoveImg = document.getElementById('btnRemoveImg');
    const replaceImgInput = document.getElementById('replaceImgInput');

    // --- App Initializer ---
    function init() {
      renderLayoutPresets();
      setLayout(LAYOUT_TEMPLATES[5]);
      setupTabSwitching();
      setupEventListeners();
      updateCanvasSize();
    }

    // --- Render Layout Buttons in Sidebar ---
    function renderLayoutPresets() {
      layoutGrid.innerHTML = '';
      LAYOUT_TEMPLATES.forEach((layout) => {
        const btn = document.createElement('button');
        btn.className = `layout-preset-btn p-2 rounded-xl border border-slate-800 bg-slate-800/40 hover:bg-slate-800 transition flex flex-col items-center gap-2 group ${
          layout.id === state.currentLayout.id ? 'border-brand-500 bg-brand-500/10' : ''
        }`;
        
        let rectsHTML = '';
        layout.rects.forEach(r => {
          rectsHTML += `<div class="absolute bg-slate-600 group-hover:bg-brand-400 rounded-[1px] transition-colors" style="top:${r.top}%; left:${r.left}%; width:${r.width}%; height:${r.height}%; border: 1px solid rgba(15,23,42,0.8);"></div>`;
        });

        btn.innerHTML = `
          <div class="w-12 h-12 relative bg-slate-900 rounded overflow-hidden">
            ${rectsHTML}
          </div>
          <span class="text-[11px] text-slate-400 group-hover:text-slate-200">${layout.name}</span>
        `;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.layout-preset-btn').forEach(b => b.classList.remove('border-brand-500', 'bg-brand-500/10'));
          btn.classList.add('border-brand-500', 'bg-brand-500/10');
          setLayout(layout);
        });

        layoutGrid.appendChild(btn);
      });
    }

    // --- Set Current Layout ---
    function setLayout(layout) {
      state.currentLayout = layout;
      
      const oldData = [...state.blocksData];
      state.blocksData = layout.rects.map((rect, idx) => {
        return oldData[idx] || {
          imgElement: null,
          offsetX: 0,
          offsetY: 0,
          scale: 1,
          rotate: 0,
          flipH: false,
          flipV: false
        };
      });

      state.activeBlockIndex = null;
      updateActiveBlockControlsUI();
      renderCanvas();
    }

    // --- Render Canvas DOM ---
    function renderCanvas() {
      collageCanvas.innerHTML = '';

      if (state.background.type === 'solid') {
        collageCanvas.style.background = state.background.color;
      } else {
        collageCanvas.style.background = state.background.gradient;
      }

      collageCanvas.style.padding = `${state.padding}px`;

      state.currentLayout.rects.forEach((rect, index) => {
        const blockData = state.blocksData[index];

        const slot = document.createElement('div');
        slot.className = `absolute overflow-hidden transition-shadow group ${
          state.activeBlockIndex === index ? 'ring-2 ring-brand-500 ring-offset-2 ring-offset-slate-900 z-10' : ''
        }`;

        const gap = state.gap;
        slot.style.top = `calc(${rect.top}% + ${gap / 2}px)`;
        slot.style.left = `calc(${rect.left}% + ${gap / 2}px)`;
        slot.style.width = `calc(${rect.width}% - ${gap}px)`;
        slot.style.height = `calc(${rect.height}% - ${gap}px)`;
        slot.style.borderRadius = `${state.radius}px`;

        if (blockData && blockData.imgElement) {
          const imgContainer = document.createElement('div');
          imgContainer.className = 'w-full h-full relative cursor-grab active:cursor-grabbing flex items-center justify-center touch-none';

          const img = document.createElement('img');
          img.src = blockData.imgElement.src;
          img.className = 'absolute max-w-none select-none pointer-events-none transition-transform duration-75';
          img.style.transform = `
            translate(${blockData.offsetX}px, ${blockData.offsetY}px) 
            scale(${blockData.scale}) 
            rotate(${blockData.rotate}deg) 
            scale(${blockData.flipH ? -1 : 1}, ${blockData.flipV ? -1 : 1})
          `;
          
          img.style.minWidth = '100%';
          img.style.minHeight = '100%';
          img.style.objectFit = 'cover';

          imgContainer.appendChild(img);
          slot.appendChild(imgContainer);

          setupImageInteractions(imgContainer, index);

        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'w-full h-full bg-slate-800/40 hover:bg-slate-800/80 border border-dashed border-slate-700/60 hover:border-brand-500/50 flex flex-col items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-brand-400 transition';
          placeholder.innerHTML = `
            <i class="fa-solid fa-plus text-xl"></i>
            <span class="text-[11px]">新增圖片</span>
          `;

          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = 'image/*';
          fileInput.className = 'hidden';

          fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
              handleImageUpload(e.target.files[0], index);
            }
          });

          placeholder.addEventListener('click', (e) => {
            e.stopPropagation();
            selectBlock(index);
            fileInput.click();
          });

          slot.appendChild(placeholder);
          slot.appendChild(fileInput);
        }

        slot.addEventListener('click', (e) => {
          e.stopPropagation();
          selectBlock(index);
        });

        collageCanvas.appendChild(slot);
      });
    }

    // --- Interactive Zoom & Pan Handler ---
    function setupImageInteractions(container, blockIndex) {
      let isDragging = false;
      let startX, startY;
      let initialOffsetX, initialOffsetY;
      let initialPinchDistance = null;
      let initialPinchScale = 1;

      // Mouse Wheel Zoom
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        selectBlock(blockIndex);

        const delta = e.deltaY < 0 ? 0.05 : -0.05;
        let newScale = state.blocksData[blockIndex].scale + delta;
        newScale = Math.min(Math.max(newScale, 0.5), 3.0);

        state.blocksData[blockIndex].scale = newScale;
        updateActiveBlockControlsUI();
        renderCanvas();
      }, { passive: false });

      // Drag / Pinch Start
      const onStart = (e) => {
        selectBlock(blockIndex);

        if (e.touches && e.touches.length === 2) {
          initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialPinchScale = state.blocksData[blockIndex].scale;
        } else {
          isDragging = true;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          startX = clientX;
          startY = clientY;
          initialOffsetX = state.blocksData[blockIndex].offsetX;
          initialOffsetY = state.blocksData[blockIndex].offsetY;
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      };

      // Drag / Pinch Move
      const onMove = (e) => {
        if (e.touches && e.touches.length === 2 && initialPinchDistance) {
          e.preventDefault();
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = dist / initialPinchDistance;
          let newScale = initialPinchScale * factor;
          newScale = Math.min(Math.max(newScale, 0.5), 3.0);

          state.blocksData[blockIndex].scale = newScale;
          updateActiveBlockControlsUI();
          renderCanvas();
          return;
        }

        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const deltaX = clientX - startX;
        const deltaY = clientY - startY;

        state.blocksData[blockIndex].offsetX = initialOffsetX + deltaX;
        state.blocksData[blockIndex].offsetY = initialOffsetY + deltaY;

        renderCanvas();
      };

      const onEnd = () => {
        isDragging = false;
        initialPinchDistance = null;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      };

      container.addEventListener('mousedown', onStart);
      container.addEventListener('touchstart', onStart, { passive: false });
    }

    // --- Image Upload Processor ---
    function handleImageUpload(file, targetIndex) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          state.blocksData[targetIndex] = {
            imgElement: img,
            offsetX: 0,
            offsetY: 0,
            scale: 1,
            rotate: 0,
            flipH: false,
            flipV: false
          };
          renderCanvas();
          selectBlock(targetIndex);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- Select Active Block ---
    function selectBlock(index) {
      state.activeBlockIndex = index;
      updateActiveBlockControlsUI();
      renderCanvas();
    }

    // Update Controls Sidebar for Active Image
    function updateActiveBlockControlsUI() {
      const activeData = state.activeBlockIndex !== null ? state.blocksData[state.activeBlockIndex] : null;

      if (activeData && activeData.imgElement) {
        blockControls.classList.remove('hidden');
        btnResetImg.classList.remove('hidden');
        noBlockSelectedHint.classList.add('hidden');

        inputZoom.value = activeData.scale;
        valZoom.textContent = `${Math.round(activeData.scale * 100)}%`;

        inputRotate.value = activeData.rotate;
        valRotate.textContent = `${activeData.rotate}°`;

        btnFlipH.classList.toggle('bg-brand-600', activeData.flipH);
        btnFlipH.classList.toggle('text-white', activeData.flipH);
        btnFlipV.classList.toggle('bg-brand-600', activeData.flipV);
        btnFlipV.classList.toggle('text-white', activeData.flipV);
      } else {
        blockControls.classList.add('hidden');
        btnResetImg.classList.add('hidden');
        noBlockSelectedHint.classList.remove('hidden');
        if (activeData) {
          noBlockSelectedHint.textContent = '此區塊尚未上傳圖片';
        } else {
          noBlockSelectedHint.textContent = '點擊畫布上的特定圖片進行旋轉與縮放';
        }
      }
    }

    // --- Dynamic Ratio Canvas Sizing ---
    function updateCanvasSize() {
      const [wRatio, hRatio] = state.aspectRatio.split(':').map(Number);
      const parent = collageCanvas.parentElement;
      const maxW = Math.min(parent.clientWidth - 32, 650);
      const maxH = Math.min(parent.clientHeight - 32, 650);

      let targetW, targetH;

      if (wRatio / hRatio >= 1) {
        targetW = maxW;
        targetH = maxW * (hRatio / wRatio);
        if (targetH > maxH) {
          targetH = maxH;
          targetW = maxH * (wRatio / hRatio);
        }
      } else {
        targetH = maxH;
        targetW = maxH * (wRatio / hRatio);
        if (targetW > maxW) {
          targetW = maxW;
          targetH = maxW * (hRatio / wRatio);
        }
      }

      collageCanvas.style.width = `${targetW}px`;
      collageCanvas.style.height = `${targetH}px`;
      renderCanvas();
    }

    // --- Setup UI Events ---
    function setupEventListeners() {
      window.addEventListener('resize', updateCanvasSize);

      document.addEventListener('click', (e) => {
        if (!collageCanvas.contains(e.target) && !activeBlockControls.contains(e.target)) {
          state.activeBlockIndex = null;
          updateActiveBlockControlsUI();
          renderCanvas();
        }
      });

      document.querySelectorAll('.ratio-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.ratio-btn').forEach(b => {
            b.classList.remove('active', 'border-brand-500', 'text-white');
            b.classList.add('border-slate-800', 'text-slate-400');
          });
          btn.classList.add('active', 'border-brand-500', 'text-white');
          btn.classList.remove('border-slate-800', 'text-slate-400');
          
          state.aspectRatio = btn.dataset.ratio;
          updateCanvasSize();
        });
      });

      inputGap.addEventListener('input', (e) => {
        state.gap = parseInt(e.target.value);
        valGap.textContent = `${state.gap}px`;
        renderCanvas();
      });

      inputRadius.addEventListener('input', (e) => {
        state.radius = parseInt(e.target.value);
        valRadius.textContent = `${state.radius}px`;
        renderCanvas();
      });

      inputPadding.addEventListener('input', (e) => {
        state.padding = parseInt(e.target.value);
        valPadding.textContent = `${state.padding}px`;
        renderCanvas();
      });

      inputZoom.addEventListener('input', (e) => {
        if (state.activeBlockIndex !== null && state.blocksData[state.activeBlockIndex]) {
          state.blocksData[state.activeBlockIndex].scale = parseFloat(e.target.value);
          valZoom.textContent = `${Math.round(parseFloat(e.target.value) * 100)}%`;
          renderCanvas();
        }
      });

      inputRotate.addEventListener('input', (e) => {
        if (state.activeBlockIndex !== null && state.blocksData[state.activeBlockIndex]) {
          state.blocksData[state.activeBlockIndex].rotate = parseInt(e.target.value);
          valRotate.textContent = `${e.target.value}°`;
          renderCanvas();
        }
      });

      btnRotate90.addEventListener('click', () => {
        if (state.activeBlockIndex !== null && state.blocksData[state.activeBlockIndex]) {
          let curr = state.blocksData[state.activeBlockIndex].rotate;
          curr = (curr + 90) % 360;
          state.blocksData[state.activeBlockIndex].rotate = curr;
          updateActiveBlockControlsUI();
          renderCanvas();
        }
      });

      btnFlipH.addEventListener('click', () => {
        if (state.activeBlockIndex !== null && state.blocksData[state.activeBlockIndex]) {
          state.blocksData[state.activeBlockIndex].flipH = !state.blocksData[state.activeBlockIndex].flipH;
          updateActiveBlockControlsUI();
          renderCanvas();
        }
      });

      btnFlipV.addEventListener('click', () => {
        if (state.activeBlockIndex !== null && state.blocksData[state.activeBlockIndex]) {
          state.blocksData[state.activeBlockIndex].flipV = !state.blocksData[state.activeBlockIndex].flipV;
          updateActiveBlockControlsUI();
          renderCanvas();
        }
      });

      btnResetImg.addEventListener('click', () => {
        if (state.activeBlockIndex !== null && state.blocksData[state.activeBlockIndex]) {
          state.blocksData[state.activeBlockIndex].offsetX = 0;
          state.blocksData[state.activeBlockIndex].offsetY = 0;
          state.blocksData[state.activeBlockIndex].scale = 1;
          state.blocksData[state.activeBlockIndex].rotate = 0;
          state.blocksData[state.activeBlockIndex].flipH = false;
          state.blocksData[state.activeBlockIndex].flipV = false;
          updateActiveBlockControlsUI();
          renderCanvas();
        }
      });

      replaceImgInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0] && state.activeBlockIndex !== null) {
          handleImageUpload(e.target.files[0], state.activeBlockIndex);
        }
      });

      btnRemoveImg.addEventListener('click', () => {
        if (state.activeBlockIndex !== null) {
          state.blocksData[state.activeBlockIndex].imgElement = null;
          updateActiveBlockControlsUI();
          renderCanvas();
        }
      });

      const bgTypeSolid = document.getElementById('bgTypeSolid');
      const bgTypeGradient = document.getElementById('bgTypeGradient');
      const solidColorPanel = document.getElementById('solidColorPanel');
      const gradientColorPanel = document.getElementById('gradientColorPanel');
      
      const exportFormatSelect = document.getElementById('exportFormat');
      const exportQualitySelect = document.getElementById('exportQuality');

      // Quality dropdown visibility based on format
      exportFormatSelect.addEventListener('change', (e) => {
        if (e.target.value === 'png') {
          exportQualitySelect.classList.add('hidden');
        } else {
          exportQualitySelect.classList.remove('hidden');
        }
      });

      bgTypeSolid.addEventListener('click', () => {
        state.background.type = 'solid';
        bgTypeSolid.className = 'p-2 rounded-lg border border-brand-500 bg-brand-500/10 text-xs font-medium text-brand-400';
        bgTypeGradient.className = 'p-2 rounded-lg border border-slate-800 bg-slate-800/50 text-xs font-medium text-slate-400 hover:text-slate-200';
        solidColorPanel.classList.remove('hidden');
        gradientColorPanel.classList.add('hidden');
        renderCanvas();
      });

      bgTypeGradient.addEventListener('click', () => {
        state.background.type = 'gradient';
        bgTypeGradient.className = 'p-2 rounded-lg border border-brand-500 bg-brand-500/10 text-xs font-medium text-brand-400';
        bgTypeSolid.className = 'p-2 rounded-lg border border-slate-800 bg-slate-800/50 text-xs font-medium text-slate-400 hover:text-slate-200';
        gradientColorPanel.classList.remove('hidden');
        solidColorPanel.classList.add('hidden');
        renderCanvas();
      });

      document.querySelectorAll('.color-picker-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          state.background.color = btn.dataset.color;
          document.getElementById('inputCustomBgColor').value = btn.dataset.color;
          renderCanvas();
        });
      });

      document.getElementById('inputCustomBgColor').addEventListener('input', (e) => {
        state.background.color = e.target.value;
        renderCanvas();
      });

      document.querySelectorAll('.gradient-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          state.background.gradient = btn.dataset.gradient;
          renderCanvas();
        });
      });

      document.getElementById('globalImageUpload').addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        let fileIdx = 0;
        state.blocksData.forEach((block, idx) => {
          if (!block.imgElement && files[fileIdx]) {
            handleImageUpload(files[fileIdx], idx);
            fileIdx++;
          }
        });
      });

      document.getElementById('btnClearAll').addEventListener('click', () => {
        state.blocksData.forEach(block => {
          block.imgElement = null;
          block.offsetX = 0;
          block.offsetY = 0;
          block.scale = 1;
          block.rotate = 0;
          block.flipH = false;
          block.flipV = false;
        });
        state.activeBlockIndex = null;
        updateActiveBlockControlsUI();
        renderCanvas();
      });

      document.getElementById('btnExport').addEventListener('click', exportHighResCollage);
    }

    // --- Tab Switcher Logic ---
    function setupTabSwitching() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => {
            t.classList.remove('active', 'text-brand-500', 'border-brand-500');
            t.classList.add('text-slate-400', 'border-transparent');
          });
          tab.classList.add('active', 'text-brand-500', 'border-brand-500');
          tab.classList.remove('text-slate-400', 'border-transparent');

          document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
          document.getElementById(`tab-${tab.dataset.tab}`).classList.remove('hidden');
        });
      });
    }

    // --- High-Res HTML5 Canvas Exporter ---
    function exportHighResCollage() {
      const exportCanvas = document.getElementById('exportCanvas');
      const ctx = exportCanvas.getContext('2d');

      const format = document.getElementById('exportFormat').value; // 'png' or 'jpeg'
      const quality = parseFloat(document.getElementById('exportQuality').value) || 0.9;

      const targetWidth = 2000;
      const [wRatio, hRatio] = state.aspectRatio.split(':').map(Number);
      const targetHeight = Math.round(targetWidth * (hRatio / wRatio));

      exportCanvas.width = targetWidth;
      exportCanvas.height = targetHeight;

      // Always fill baseline background (Crucial for JPG to prevent black borders/artifacts)
      if (state.background.type === 'solid') {
        ctx.fillStyle = state.background.color || '#ffffff';
        ctx.fillRect(0, 0, targetWidth, targetHeight);
      } else {
        const grad = ctx.createLinearGradient(0, 0, targetWidth, targetHeight);
        grad.addColorStop(0, '#ec4899');
        grad.addColorStop(1, '#f43f5e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, targetWidth, targetHeight);
      }

      const paddingPx = (state.padding / collageCanvas.clientWidth) * targetWidth;
      const gapPx = (state.gap / collageCanvas.clientWidth) * targetWidth;
      const radiusPx = (state.radius / collageCanvas.clientWidth) * targetWidth;

      const innerW = targetWidth - paddingPx * 2;
      const innerH = targetHeight - paddingPx * 2;

      state.currentLayout.rects.forEach((rect, idx) => {
        const block = state.blocksData[idx];

        const x = paddingPx + (rect.left / 100) * innerW + gapPx / 2;
        const y = paddingPx + (rect.top / 100) * innerH + gapPx / 2;
        const w = (rect.width / 100) * innerW - gapPx;
        const h = (rect.height / 100) * innerH - gapPx;

        ctx.save();

        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') {
          ctx.roundRect(x, y, w, h, radiusPx);
        } else {
          ctx.rect(x, y, w, h);
        }
        ctx.clip();

        ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
        ctx.fillRect(x, y, w, h);

        if (block && block.imgElement) {
          const img = block.imgElement;

          const imgRatio = img.width / img.height;
          const rectRatio = w / h;
          let drawW, drawH;

          if (imgRatio > rectRatio) {
            drawH = h;
            drawW = h * imgRatio;
          } else {
            drawW = w;
            drawH = w / imgRatio;
          }

          const centerX = x + w / 2;
          const centerY = y + h / 2;

          ctx.translate(centerX, centerY);

          const scaleRatio = targetWidth / collageCanvas.clientWidth;
          ctx.translate(block.offsetX * scaleRatio, block.offsetY * scaleRatio);
          ctx.rotate((block.rotate * Math.PI) / 180);
          ctx.scale(
            block.scale * (block.flipH ? -1 : 1), 
            block.scale * (block.flipV ? -1 : 1)
          );

          ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
        }

        ctx.restore();
      });

      setTimeout(() => {
        const mimeType = `image/${format}`;
        const ext = format === 'jpeg' ? 'jpg' : 'png';
        const link = document.createElement('a');
        link.download = `collage-${Date.now()}.${ext}`;
        link.href = exportCanvas.toDataURL(mimeType, quality);
        link.click();
      }, 100);
    }

    // Initialize Application
    window.onload = init;
  </script>
